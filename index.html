<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GMM Service Charge & Incentive</title>
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="brand-mark" aria-hidden="true">G</div><div>Service Charge &amp; Incentive<small>Grandmama's · HR tool</small></div></div>
  <span class="pill" id="monthPill"></span>
  <span class="spacer"></span>
  <button type="button" data-act="help">Help</button>
  <button type="button" data-act="settings">Settings</button>
</header>
<nav class="steps" aria-label="Steps">
  <div class="step" data-step="1" tabindex="0" role="button"><b>1</b>Attendance (AI)</div>
  <div class="step" data-step="2" tabindex="0" role="button"><b>2</b>Outlet &amp; entitlement</div>
  <div class="step" data-step="3" tabindex="0" role="button"><b>3</b>Review &amp; edit</div>
  <div class="step" data-step="4" tabindex="0" role="button"><b>4</b>Export Excel</div>
</nav>
<main id="view"></main>
<aside id="drawer" aria-label="Staff details"></aside>
<div id="popover" role="dialog" aria-label="Formula"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Settings"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<!--VENDOR-->
<script src="vendor/exceljs.min.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="vendor/pdf.min.js"></script>
<!--/VENDOR-->
<!--APP-->
<script src="src/engine.js"></script>
<script src="src/exporter.js"></script>
<script src="src/ai.js"></script>
<script src="src/app.js"></script>
<!--/APP-->
</body>
</html>
